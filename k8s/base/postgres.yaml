# Her ortamın kendi PostgreSQL'i. Ortamlar arası veri sızıntısı olmasın diye
# tek bir sunucuyu paylaşmıyoruz.
apiVersion: v1
kind: Service
metadata:
  name: itacm-db
spec:
  clusterIP: None
  selector:
    app: itacm-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: itacm-db
spec:
  serviceName: itacm-db
  replicas: 1
  selector:
    matchLabels:
      app: itacm-db
  template:
    metadata:
      labels:
        app: itacm-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: itacm
            - name: POSTGRES_USER
              value: itacm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itacm-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "itacm", "-d", "itacm"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-critical
        resources:
          requests:
            storage: 5Gi
