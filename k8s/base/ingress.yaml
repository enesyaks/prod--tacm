# Traefik yönlendirmesi. TLS yok: Cloudflare tüneli kenarda sonlandırıyor.
# host her overlay'de yamalanır.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itacm
spec:
  ingressClassName: traefik
  rules:
    - host: PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: itacm
                port:
                  name: http
