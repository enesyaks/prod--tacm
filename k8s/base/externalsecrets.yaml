# Vault'taki parolalari Kubernetes Secret'ina ceviren iki kopru.
# Parolalarin kendisi bu dosyada YOK; sadece nereden alinacagi yaziyor.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: itacm-secrets
spec:
  # Saatte bir Vault'a tekrar sorar. Vault'ta parolayi degistirirsen en gec
  # bir saat icinde Secret guncellenir.
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    # SecretStore tek namespace'te gecerlidir; iki ortamda da ayni Vault'u
    # kullandigimiz icin cluster capinda olani gerekiyor.
    kind: ClusterSecretStore
  target:
    name: itacm-secrets
    # Secret'i bu nesne yaratir ve sahiplenir; silinirse Secret de silinir.
    creationPolicy: Owner
  # extract: o Vault yolundaki BUTUN anahtarlari oldugu gibi tasir.
  # Bu yuzden Vault'taki anahtar adlari BUYUK HARF olmak zorunda.
  # Yolu her overlay tek satirlik bir yamayla degistirir.
  dataFrom:
    - extract:
        key: itacm/ENV

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-pull
    creationPolicy: Owner
    # Buradaki is bir BICIM DONUSUMU: Vault'ta kullanici adi ve parola iki ayri
    # alan, Kubernetes ise docker'in anladigi tek bir JSON istiyor.
    template:
      # Kubernetes imagePullSecrets alaninda SADECE bu turu kabul eder.
      # Opaque yazilirsa sessizce yok sayilir ve ImagePullBackOff alinir.
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"harbor.itacm.site":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  # Burada extract DEGIL tek tek esleme var: sablonun .username ve .password
  # adlarina ihtiyaci var, Vault'takilerin adi ise robot_username.
  data:
    - secretKey: username
      remoteRef:
        key: harbor
        property: robot_username
    - secretKey: password
      remoteRef:
        key: harbor
        property: robot_password
