# Vault'taki sırları Kubernetes Secret'ına çeviren iki köprü.
# Parolaların kendisi hiçbir dosyada yazmaz; burada sadece "nereden alınacağı" durur.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: itacm-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: itacm-secrets
    creationPolicy: Owner
  # extract: Vault yolundaki BÜTÜN anahtarları olduğu gibi Secret'a taşır.
  # Bu yüzden Vault'taki anahtar adları büyük harf olmalı (POSTGRES_PASSWORD gibi).
  # Yol her overlay'de tek satırlık bir yamayla değiştirilir.
  dataFrom:
    - extract:
        key: itacm/ENV
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-pull
    creationPolicy: Owner
    # Harbor robot hesabı iki ayrı alan olarak duruyor; Kubernetes ise
    # docker'ın beklediği tek bir JSON istiyor. Şablon o dönüşümü yapar.
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"harbor.itacm.site":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  # secret/harbor'da acik esleme kullaniyoruz, bu yuzden Vault'taki anahtar
  # adlari kucuk harf kalabiliyor. secret/itacm/* farkli: orada extract var,
  # Vault'taki ad dogrudan Secret anahtari oluyor, dolayisiyla buyuk harf sart.
  data:
    - secretKey: username
      remoteRef:
        key: harbor
        property: robot_username
    - secretKey: password
      remoteRef:
        key: harbor
        property: robot_password
