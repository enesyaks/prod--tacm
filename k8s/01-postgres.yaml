# PostgreSQL — ITACM'in veritabanı.
# namespace burada YAZILMAZ: Argo CD Application'ının destination.namespace'i belirler.
# Bu dosya dev / stage / main branch'lerinde birebir aynıdır.
apiVersion: v1
kind: Service
metadata:
  name: itacm-db
spec:
  # Headless servis: StatefulSet pod'una sabit isimle (itacm-db) ulaşmayı sağlar.
  clusterIP: None
  selector:
    app: itacm-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: itacm-db
spec:
  serviceName: itacm-db
  replicas: 1
  selector:
    matchLabels:
      app: itacm-db
  template:
    metadata:
      labels:
        app: itacm-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: itacm
            - name: POSTGRES_USER
              value: itacm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itacm-secrets
                  key: POSTGRES_PASSWORD
            # Longhorn diski ext4 biçimlendirip kökte lost+found bırakıyor.
            # PostgreSQL boş olmayan bir dizine kurulmayı reddeder — alt dizin şart.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "itacm", "-d", "itacm"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Varsayılan longhorn sınıfı 3 replika ayarlı; iki node olduğu için
        # Degraded kalır. Bu yüzden sınıf her zaman açıkça yazılır.
        storageClassName: longhorn-critical
        resources:
          requests:
            storage: 3Gi
