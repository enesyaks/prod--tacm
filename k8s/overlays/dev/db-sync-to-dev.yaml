apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-sync-dev-to-stage
  namespace: stage
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: sync
            image: postgres:16-alpine
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -eu
              DEV="postgres://itacm:${DEV_PASSWORD}@itacm-db.dev.svc.cluster.local:5432/itacm"
              STAGE="postgres://itacm:${STAGE_PASSWORD}@itacm-db.stage.svc.cluster.local:5432/itacm"

              echo "[sync] dev dokumu aliniyor"
              pg_dump --clean --if-exists --no-owner --no-privileges "$DEV" > /tmp/dev.sql

              echo "[sync] stage'e yaziliyor"
              psql -v ON_ERROR_STOP=1 "$STAGE" -f /tmp/dev.sql

              echo "[sync] tamam"
            env:
            - name: STAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itacm-secrets
                  key: POSTGRES_PASSWORD
            - name: DEV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itacm-dev-db
                  key: POSTGRES_PASSWORD
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
            - mountPath: /tmp
              name: tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 2Gi
