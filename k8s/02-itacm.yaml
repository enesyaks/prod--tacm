# ITACM uygulaması.
# Branch'ler arasındaki TEK fark: image etiketi. Jenkins deploy aşaması
# aşağıdaki `image:` satırını sed ile günceller, o yüzden biçimini bozma.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: itacm-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-critical
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itacm
spec:
  replicas: 1
  strategy:
    # Longhorn diski aynı anda tek pod'a bağlanır. RollingUpdate olsaydı
    # yeni pod diski bekleyip takılırdı.
    type: Recreate
  selector:
    matchLabels:
      app: itacm
  template:
    metadata:
      labels:
        app: itacm
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: itacm
          image: harbor.itacm.site/itacm/itacm:dev-a67390ba12e6eb8a047658e2e76dc7335396a340
          ports:
            - containerPort: 8000
          env:
            - name: DATA_BACKEND
              value: postgres
            - name: DATA_DIR
              value: /app/data
            - name: PORT
              value: "8000"
            # Traefik + Cloudflare tüneli önde: gerçek istemci IP'si
            # X-Forwarded-For'dan okunsun.
            - name: TRUST_PROXY
              value: "1"
            - name: APP_URL
              value: https://dev.itacm.site
            - name: ADMIN_EMAIL
              value: admin@itacm.site
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itacm-secrets
                  key: POSTGRES_PASSWORD
            # $(POSTGRES_PASSWORD) bir üstteki değişkenden gelir; parola
            # hiçbir yerde açık yazmaz.
            - name: DATABASE_URL
              value: postgres://itacm:$(POSTGRES_PASSWORD)@itacm-db:5432/itacm
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: itacm-secrets
                  key: JWT_SECRET
          volumeMounts:
            # Giriş scripti burasının gerçek bir mount olduğunu doğruluyor;
            # değilse FATAL verip çıkıyor. PVC şart.
            - name: data
              mountPath: /app/data
          readinessProbe:
            # /api/health veritabanı yoksa 503 döner — trafik almasın.
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            # Kasıtlı olarak /api/health DEĞİL: Postgres kısa süre takıldığında
            # uygulamanın restart döngüsüne girmesini istemiyoruz.
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      # securityContext KASITLI olarak yok: giriş scripti root başlayıp diski
      # hazırlıyor, sonra kendini `node` kullanıcısına düşürüyor.
      # runAsNonRoot: true yazılırsa pod hiç açılmaz.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: itacm-data
            
---
apiVersion: v1
kind: Service
metadata:
  name: itacm
spec:
  selector:
    app: itacm
  ports:
    - port: 80
      targetPort: 80
