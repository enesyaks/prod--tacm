name: CI/CD

on:
  pull_request:
    branches: [stage, main]
  push:
    branches: [stage, main]
  workflow_dispatch:

# Varsayilan read'dir. write istiyoruz cunku hattin sonunda image etiketini
# deploy dalina yazip commit atacagiz.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR'da yeni commit gelirse eskisini bosuna kosturmaya gerek yok. Push'ta ise
  # iptal etmiyoruz: image gonderimi yarida kesilirse Harbor'da eksik katman kalir.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: harbor.itacm.site/itacm/itacm
  DEPLOY_BRANCH: deploy

jobs:
  # ---------------------------------------------------------------------------
  dogrula:
    name: Lint + birim testleri (Node ${{ matrix.node }})
    runs-on: arc-runner-set
    strategy:
      fail-fast: false
      matrix:
        # 26 uretimde calisan surum (Dockerfile). 20 ise package.json'daki
        # engines soznun hala tutuldugunu kanitliyor.
        node: ['26', '20']
    steps:
      - uses: actions/checkout@v7

      # Node 26 ikilisi libatomic.so.1'e bagli ve ARC runner image'inda o
      # kutuphane yok: setup-node surumu indirir, acar, sonra calistiramaz.
      # Kalici cozum kutuphaneyi iceren ozel bir runner image'i olurdu.
      - name: Eksik sistem kütüphanesi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libatomic1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Veritabani YOK: birim testlerinin gercekten izole oldugunu kanitliyor.
      - run: npm test

  # ---------------------------------------------------------------------------
  entegrasyon:
    name: Entegrasyon testleri (gerçek PostgreSQL)
    runs-on: arc-runner-set
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itacm_ci
          POSTGRES_PASSWORD: itacm_ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        # Bu blok olmadan testler PostgreSQL hazir olmadan baslar ve
        # ECONNREFUSED alir. GitHub, saglik kontrolu gecene kadar adimlari
        # baslatmiyor.
        options: >-
          --health-cmd "pg_isready -U itacm_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Node 26 ikilisi libatomic.so.1'e bagli ve ARC runner image'inda o
      # kutuphane yok: setup-node surumu indirir, acar, sonra calistiramaz.
      # Kalici cozum kutuphaneyi iceren ozel bir runner image'i olurdu.
      - name: Eksik sistem kütüphanesi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libatomic1

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # test-db.sh'in kendi basligi CI icin bu dogrudan cagriyi oneriyor:
      # veritabanini biz sagliyoruz, script'in kendi container'ini baslatmasina
      # gerek yok.
      #
      # --test-concurrency=1 sart: paralel kosarken her test dosyasi kendi gecici
      # veritabanini kurup migration'lari calistiriyor. Roller ise veritabani
      # degil CLUSTER capinda; iki kurulum ayni anda itacm_ai_ro'yu yaratmaya
      # calisinca ikincisi rolu henuz gormeden GRANT'a geciyor ve
      # "role does not exist" aliyor. npm test ayni sebeple seri kosuyor.
      - run: node --test --test-concurrency=1 tests/db/*.test.js
        env:
          TEST_DATABASE_URL: postgres://itacm_ci:itacm_ci@localhost:5432/postgres

  # ---------------------------------------------------------------------------
  imaj:
    name: Image derle ve gönder
    # Testler gecmeden image derlenmiyor bile. Argo CD ne varsa onu
    # calistirdigi icin kapi burada olmak zorunda.
    needs: [dogrula, entegrasyon]
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # --- PR yolu: yerelde derle ve tara, gonderme ------------------------
      # Harbor bu image'i hic gormeyecegi icin taramayi burada yapiyoruz.
      - name: Derle (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: itacm-pr:${{ github.sha }}
          build-args: FRONTEND_DIGEST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tara (PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: itacm-pr:${{ github.sha }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # --- Merge sonrasi: Harbor'a gonder, taramayi Harbor yapsin ----------
      - name: Vault'tan Harbor kimliğini al
        if: github.event_name == 'push'
        uses: hashicorp/vault-action@v3
        with:
          url: http://vault.vault.svc.cluster.local:8200
          method: kubernetes
          path: kubernetes
          role: github-runner
          secrets: |
            secret/data/harbor robot_username | HARBOR_USERNAME ;
            secret/data/harbor robot_password | HARBOR_PASSWORD

      - name: Harbor'a giriş
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: harbor.itacm.site
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Derle ve gönder
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: FRONTEND_DIGEST=${{ github.sha }}
          # buildx varsayilan olarak provenance attestation ekler; bu, push'u
          # tek manifest yerine index+imaj+attestation ucluse cevirir. Etiketi
          # index tasidigi ve Harbor index'i taramadigi icin arayuzde imaj
          # "Not Scanned" gorunur. Kapatinca etiket dogrudan imaj manifestine
          # bagli kalir, otomatik tarama etikette gorunur ve "Prevent
          # vulnerable images" politikasi dogru nesne uzerinde calisir.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  yayinla:
    name: Etiketi deploy dalına yaz
    needs: [imaj]
    if: github.event_name == 'push'
    runs-on: arc-runner-set
    steps:
      # Kod dalini degil DEPLOY dalini aliyoruz: etiketler orada durur,
      # boylece stage ve main saf kod dallari kalir ve aralarindaki merge
      # fast-forward olarak kalabilir.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Hangi ortam
        id: ortam
        run: |
          if [ "$GITHUB_REF" = "refs/heads/stage" ]; then
            echo "ad=stage" >> "$GITHUB_OUTPUT"
          else
            echo "ad=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Etiketi yaz
        run: |
          set -eu
          FILE="k8s/overlays/${{ steps.ortam.outputs.ad }}/kustomization.yaml"
          # Yazilan numara KOD dalinin commit'i, deploy dalininki degil.
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" "$FILE"

          # Etiket zaten dogruysa commit atma: bos commit uretmiyoruz.
          if git diff --quiet -- "$FILE"; then
            echo "${{ steps.ortam.outputs.ad }} zaten ${GITHUB_SHA} calistiriyor"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(${{ steps.ortam.outputs.ad }}): ${GITHUB_SHA}"
          git push origin "${{ env.DEPLOY_BRANCH }}"

  # ---------------------------------------------------------------------------
  terfi:
    name: main'e terfi
    needs: [yayinla]
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    runs-on: arc-runner-set
    # Onaylayicilar deponun Settings > Environments ayarinda tanimli.
    # Is, biri onaylayana kadar KUYRUKTA bekler; runner ayrilmaz.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: stage'i main'e taşı
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          # --ff-only sart: commit numarasi degismesin ki prod, stage'de
          # dogrulanan image'in AYNISINI calistirsin.
          git merge --ff-only "$GITHUB_SHA"
          git push origin main

      - name: Prod etiketini deploy dalına yaz
        run: |
          set -eu
          # main'e push az once GITHUB_TOKEN ile yapildi. GitHub'in dongu
          # korumasi yuzunden main'de YENI BIR WORKFLOW DOGMAZ; dolayisiyla
          # "yayinla" isi prod icin hicbir zaman kosmaz. Prod etiketini bu
          # yuzden burada, terfiyi yapan isin kendisinde yaziyoruz.
          git fetch origin "$DEPLOY_BRANCH"
          # -B: dal varsa uzerine yaz. deploy, stage kosusundan bu yana
          # ilerlemis olabilir; her zaman uzaktaki son hali baz aliyoruz.
          git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"

          FILE="k8s/overlays/prod/kustomization.yaml"
          # main artik $GITHUB_SHA'da (fast-forward oldugu icin numara ayni).
          # Prod'a yazdigimiz etiket, stage'de dogrulanan imajin ta kendisi.
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" "$FILE"

          if git diff --quiet -- "$FILE"; then
            echo "prod zaten ${GITHUB_SHA} calistiriyor"
            exit 0
          fi

          # user.name/user.email onceki adimda .git/config'e yazildi,
          # ayni calisma dizini oldugu icin gecerliligini koruyor.
          git commit -am "deploy(prod): ${GITHUB_SHA}"
          git push origin "$DEPLOY_BRANCH"
