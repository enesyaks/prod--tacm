apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: itacm-stage
  # Application kayitlari HER ZAMAN argocd namespace'inde durur.
  # Yonettigi kaynaklarin nerede olacagini asagidaki destination belirler.
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/enesyaks/prod--tacm.git
    # Ucunde de main. Ortamlari ayiran sey branch degil, asagidaki path.
    targetRevision: main
    path: k8s/overlays/stage

  destination:
    server: https://kubernetes.default.svc
    namespace: stage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
